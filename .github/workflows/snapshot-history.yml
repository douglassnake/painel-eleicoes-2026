name: Snapshot histórico diário

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar snapshot
        run: node scripts/snapshot.js

      - name: Commitar histórico quando houver mudança
        run: |
          if git diff --quiet -- history.js; then
            echo "Sem mudanças no histórico."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.js
          git commit -m "Atualiza snapshot histórico diário"
          git push
