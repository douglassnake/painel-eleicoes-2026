name: Atualizar modelo regional

on:
  push:
    paths:
      - '.github/workflows/update-model.yml'
      - 'regional-official-*.json'
      - 'scripts/update_model.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-model
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recalcular Monte Carlo v3
        run: python scripts/update_model.py

      - name: Publicar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js model-results.json
          if git diff --cached --quiet; then
            echo "Sem alterações no modelo."
          else
            git commit -m "Atualiza Monte Carlo v3 com snapshot TSE"
            git push
          fi

      # Commits feitos pelo GITHUB_TOKEN não disparam um novo workflow de Pages.
      # Por isso o próprio workflow publica o diretório já recalculado.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site recalculado
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
