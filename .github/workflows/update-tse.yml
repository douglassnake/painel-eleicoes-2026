name: Atualizar dados oficiais TSE

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9,15,21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install requests

      - name: Consultar Dados Abertos do TSE
        run: python scripts/update_tse.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-data.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados oficiais."
          else
            git commit -m "Atualiza dados oficiais do TSE"
            git push
          fi
